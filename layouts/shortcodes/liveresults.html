{{- $src := .Get "src" | default "https://live.loontracks.com/" -}}
<p style="text-align:center;margin:1.5rem 0">
  <a href="{{ $src }}" target="_blank" rel="noopener"
     style="display:inline-block;padding:.9rem 1.6rem;background:#0a1630;color:#fff;border-radius:8px;font-size:1.15rem;font-weight:600;text-decoration:none;box-shadow:none">Open live results →</a>
</p>
<div style="position:relative;width:100%;aspect-ratio:16/9;max-width:1280px;margin:1rem auto">
  <iframe src="{{ $src }}" title="SD8 DFL live election results"
          style="position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:8px"
          loading="lazy" allowfullscreen></iframe>
</div>
