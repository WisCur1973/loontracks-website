# Pages CMS configuration — https://pagescms.org
# Browser editor for the IRL blog at https://app.pagescms.org
# Sign in there with the GitHub account that owns this repo, authorize it,
# then use the "IRL" collection (New entry + image upload).

media:
  input: static/uploads   # where uploaded images are stored in the repo
  output: /uploads        # the URL they're served from on the site

content:
  - name: posts
    label: IRL
    type: collection
    path: content/posts
    filename: "{primary}.md"
    exclude: ["_index.md"]
    fields:
      - name: title
        label: Title
        type: string
      - name: date
        label: Date
        type: date
      - name: draft
        label: Hide from site (draft)
        type: boolean
      - name: summary
        label: Summary (shown on the homepage card)
        type: text
      - name: cover
        label: Cover image
        type: object
        fields:
          - name: image
            label: Image
            type: image
          - name: alt
            label: Alt text
            type: string
      - name: body
        label: Post
        type: rich-text
