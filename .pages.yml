# Pages CMS configuration — https://pagescms.org
# Powers the browser-based blog editor at https://app.pagescms.org
# Sign in there with the GitHub account that owns this repo, authorize it,
# and you'll get a "Blog posts" collection with a New-post form + image upload.

media:
  input: static/uploads   # where uploaded images are stored in the repo
  output: /uploads        # the URL they're served from on the site

content:
  - name: posts
    label: Blog posts
    type: collection
    path: content/posts
    filename: "{fields.title}.md"
    view:
      fields:
        - title
        - date
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        options:
          format: yyyy-MM-dd
        required: true
      - name: draft
        label: Hide from site (draft)
        type: boolean
        default: false
      - name: summary
        label: Summary (shown on the homepage card)
        type: text
      - name: cover
        label: Cover image
        type: object
        fields:
          - name: image
            label: Image
            type: image
          - name: alt
            label: Alt text
            type: string
          - name: caption
            label: Caption
            type: string
      - name: body
        label: Post
        type: rich-text
